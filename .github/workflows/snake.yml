name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation (phosphor green on black)
        uses: Platane/snk@v3
        with:
          github_user_name: Dharani2816
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00ff41&color_dots=#161b22,#0a4d1c,#008f24,#00c832,#00ff41&color_background=#0d1117
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00ff41&color_dots=#161b22,#0a4d1c,#008f24,#00c832,#00ff41&color_background=#0d1117

      - name: Push output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
